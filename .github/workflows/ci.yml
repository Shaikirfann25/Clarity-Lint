name: Clarity-Lint CI

"on":
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Syntax Validation & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip and install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install CPU-only PyTorch build
        run: |
          pip install "torch>=2.1.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies from requirements.txt
        run: |
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Verify dependencies and environment
        run: |
          pip check
          python -c "import torch; print(f'PyTorch {torch.__version__} installed (CUDA: {torch.cuda.is_available()})')"

      - name: Validate Python syntax across all project files
        run: |
          python -c "
          import py_compile, os, sys
          errors = []
          for root, dirs, files in os.walk('.'):
              if any(p in root for p in ['.venv', '.git', '.pytest_cache', 'node_modules', '.next']):
                  continue
              for f in files:
                  if f.endswith('.py'):
                      p = os.path.join(root, f)
                      try:
                          py_compile.compile(p, doraise=True)
                      except Exception as e:
                          errors.append((p, str(e)))
          if errors:
              print(f'❌ Syntax validation failed ({len(errors)} errors):')
              for p, err in errors:
                  print(f'  {p}: {err}')
              sys.exit(1)
          print('✅ Syntax validation passed for all Python source files.')
          "

      - name: Run full Pytest test suite
        run: |
          pytest tests/ -v --tb=short -ra
